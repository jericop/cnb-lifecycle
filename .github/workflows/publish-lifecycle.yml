name: publish-lifecycle

# Manual only. This workflow file lives on the fork's default branch (fork-main) so it
# is dispatchable, but it BUILDS whatever `ref` you pass (a branch or tag of
# jericop/cnb-lifecycle) and derives the published image tag from that ref. This lets
# you publish from a code branch (e.g. buildkit-native-export) that does NOT itself
# carry this workflow file.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "cnb-lifecycle git ref to build + publish from (branch or tag). The image tag is derived from this."
        required: false
        default: "buildkit-native-export"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REF: ${{ github.event.inputs.ref || 'buildkit-native-export' }}
    steps:
      # Check out the CODE to build from the requested ref (not fork-main, which only
      # carries this workflow). fetch-depth 0 so make/version tooling can see history.
      - uses: actions/checkout@v5
        with:
          repository: jericop/cnb-lifecycle
          ref: ${{ env.REF }}
          fetch-depth: 0
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          check-latest: true
          go-version-file: 'go.mod'
      - name: Build
        run: |
          make clean
          make build
          make package
      - uses: azure/docker-login@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish images
        run: |
          # Derive the image tag from the requested ref ($REF).
          #
          # Semver-style tag ref (buildkit-native-export-v*): publish an immutable,
          # pinned image whose tag matches the ref verbatim, e.g.
          #   buildkit-native-export-v0.1.0 -> jericop/lifecycle:buildkit-native-export-v0.1.0
          # pack's go.mod replace + the builder's [lifecycle].uri pin to this tag.
          #
          # Branch ref: publish a moving per-branch tag so each branch publishes its own
          # tag and never clobbers another:
          #   skip-chown             -> jericop/lifecycle:skip-chown-poc  (legacy alias)
          #   buildkit-native-export -> jericop/lifecycle:buildkit-native-export
          case "${REF}" in
            buildkit-native-export-v*)
              LIFECYCLE_IMAGE_TAG="${REF}"
              echo "Publishing lifecycle tag: ${LIFECYCLE_IMAGE_TAG} (semver ref)"
              ;;
            skip-chown)
              LIFECYCLE_IMAGE_TAG=skip-chown-poc
              echo "Publishing lifecycle tag: ${LIFECYCLE_IMAGE_TAG} (branch ${REF})"
              ;;
            *)
              LIFECYCLE_IMAGE_TAG="${REF}"
              echo "Publishing lifecycle tag: ${LIFECYCLE_IMAGE_TAG} (ref ${REF})"
              ;;
          esac

          LINUX_AMD64_SHA=$(go run ./tools/image/main.go -lifecyclePath ./out/lifecycle-v*+linux.x86-64.tgz -tag jericop/lifecycle:${LIFECYCLE_IMAGE_TAG}-linux-x86-64 | awk '{print $NF}')
          echo "LINUX_AMD64_SHA: $LINUX_AMD64_SHA"

          LINUX_ARM64_SHA=$(go run ./tools/image/main.go -lifecyclePath ./out/lifecycle-v*+linux.arm64.tgz -tag jericop/lifecycle:${LIFECYCLE_IMAGE_TAG}-linux-arm64 -arch arm64 | awk '{print $NF}')
          echo "LINUX_ARM64_SHA: $LINUX_ARM64_SHA"

          docker manifest create jericop/lifecycle:${LIFECYCLE_IMAGE_TAG} \
              jericop/lifecycle:${LIFECYCLE_IMAGE_TAG}-linux-x86-64@${LINUX_AMD64_SHA} \
              jericop/lifecycle:${LIFECYCLE_IMAGE_TAG}-linux-arm64@${LINUX_ARM64_SHA}

          MANIFEST_SHA=$(docker manifest push jericop/lifecycle:${LIFECYCLE_IMAGE_TAG})
          echo "MANIFEST_SHA: $MANIFEST_SHA"
          echo "Published: jericop/lifecycle:${LIFECYCLE_IMAGE_TAG}"
