name: publish-lifecycle

on:
  push:
    branches:
      - skip-chown
      - buildkit-multi-arch-support
      - buildkit-native-export
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          check-latest: true
          go-version-file: 'go.mod'
      - name: Build
        run: |
          make clean
          make build
          make package
      - uses: azure/docker-login@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish images
        run: |
          # Derive the image tag from the branch so each feature branch publishes
          # its own tag and never clobbers another:
          #   skip-chown                 -> jericop/lifecycle:skip-chown-poc
          #   buildkit-multi-arch-support-> jericop/lifecycle:buildkit-multi-arch-support
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "${BRANCH}" = "skip-chown" ]; then
            LIFECYCLE_IMAGE_TAG=skip-chown-poc
          else
            LIFECYCLE_IMAGE_TAG="${BRANCH}"
          fi
          echo "Publishing lifecycle tag: ${LIFECYCLE_IMAGE_TAG} (branch ${BRANCH})"

          LINUX_AMD64_SHA=$(go run ./tools/image/main.go -lifecyclePath ./out/lifecycle-v*+linux.x86-64.tgz -tag jericop/lifecycle:${LIFECYCLE_IMAGE_TAG}-linux-x86-64 | awk '{print $NF}')
          echo "LINUX_AMD64_SHA: $LINUX_AMD64_SHA"

          LINUX_ARM64_SHA=$(go run ./tools/image/main.go -lifecyclePath ./out/lifecycle-v*+linux.arm64.tgz -tag jericop/lifecycle:${LIFECYCLE_IMAGE_TAG}-linux-arm64 -arch arm64 | awk '{print $NF}')
          echo "LINUX_ARM64_SHA: $LINUX_ARM64_SHA"

          docker manifest create jericop/lifecycle:${LIFECYCLE_IMAGE_TAG} \
              jericop/lifecycle:${LIFECYCLE_IMAGE_TAG}-linux-x86-64@${LINUX_AMD64_SHA} \
              jericop/lifecycle:${LIFECYCLE_IMAGE_TAG}-linux-arm64@${LINUX_ARM64_SHA}

          MANIFEST_SHA=$(docker manifest push jericop/lifecycle:${LIFECYCLE_IMAGE_TAG})
          echo "MANIFEST_SHA: $MANIFEST_SHA"
          echo "Published: jericop/lifecycle:${LIFECYCLE_IMAGE_TAG}"
